name: obsidian-mcp-server

services:
  obsidian-server:
    image: obsidian-mcp-server:latest
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    container_name: obsidian-mcp-server
    init: true
    user: "1002:10"
    ports:
      - "${MCP_PORT:-18923}:18923"
    environment:
      HOME: /data
      HOST: 0.0.0.0
      PORT: 18923
      MCP_PATH: /mcp
      MCP_SERVER_NAME: obsidian-mcp-server
      MCP_SERVER_VERSION: "${MCP_SERVER_VERSION:-1.0.0}"
      VAULT_PATH: /vault
      VAULT_WORKSPACE_ROOT: "${VAULT_WORKSPACE_ROOT:-_Workspace}"
      WEB_VAULTS_ROOT: /vaults
      WEB_DEFAULT_VAULT: "${WEB_DEFAULT_VAULT:-vault}"
      # Vault hot discovery (W4 #437) — OFF by default. Discovery is not authorization: a new directory
      # under /vaults lands as `pending` until an administrator approves it. The parent is already
      # mounted (${OBSIDIAN_VAULTS_ROOT:-./vaults}:/vaults); an unmounted host directory cannot be
      # discovered. See docs/USER_CONFIGURATION.md -> Multi-Vault.
      VAULT_DISCOVERY_ENABLED: "${VAULT_DISCOVERY_ENABLED:-false}"
      # Optional tuning, read only when discovery is enabled. Forwarded unconditionally so a value set
      # in the operator's .env actually reaches the process (the defaults equal the frozen parameters).
      VAULT_DISCOVERY_DEBOUNCE_MS: "${VAULT_DISCOVERY_DEBOUNCE_MS:-500}"
      VAULT_DISCOVERY_MAX_COALESCE_MS: "${VAULT_DISCOVERY_MAX_COALESCE_MS:-5000}"
      VAULT_DISCOVERY_PERIODIC_SECONDS: "${VAULT_DISCOVERY_PERIODIC_SECONDS:-60}"
      VAULT_DISCOVERY_PERIODIC_MAX_SECONDS: "${VAULT_DISCOVERY_PERIODIC_MAX_SECONDS:-900}"
      WEB_CATALOG_ENABLED: "${WEB_CATALOG_ENABLED:-true}"
      WEB_CATALOG_DIR: "${WEB_CATALOG_DIR:-/data/web-catalog}"
      DATA_PATH: /data
      WEB_DEPRECATION_OPS_LOG: "${WEB_DEPRECATION_OPS_LOG:-/data/ops-log/web-deprecation.log}"
      TRASH_PATH: /data/trash
      HISTORY_PATH: /data/history
      OBSIDIAN_READ_ONLY: "${OBSIDIAN_READ_ONLY:-false}"
      API_KEY: "${API_KEY:-}"
      API_KEY_HEADER: "${API_KEY_HEADER:-X-API-Key}"
      OAUTH_ENABLED: "${OAUTH_ENABLED:-false}"
      AUTHZ_ENABLED: "${AUTHZ_ENABLED:-false}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      PUBLIC_BASE_URL_ALIASES: "${PUBLIC_BASE_URL_ALIASES:-}"
      OAUTH_ADMIN_PASSWORD: "${OAUTH_ADMIN_PASSWORD:-}"
      OAUTH_INITIAL_USERNAME: "${OAUTH_INITIAL_USERNAME:-}"
      OAUTH_INITIAL_PASSWORD: "${OAUTH_INITIAL_PASSWORD:-}"
      OAUTH_ACCESS_TOKEN_TTL_SECONDS: "${OAUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}"
      OAUTH_REFRESH_TOKEN_TTL_SECONDS: "${OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}"
      OAUTH_REFRESH_REUSE_GRACE_SECONDS: "${OAUTH_REFRESH_REUSE_GRACE_SECONDS:-30}"
      AUTH_AUDIT_MAX_ENTRIES: "${AUTH_AUDIT_MAX_ENTRIES:-2000}"
      AUTH_ADMIN_SESSION_TTL_SECONDS: "${AUTH_ADMIN_SESSION_TTL_SECONDS:-3600}"
      PROTECT_HEALTH: "${PROTECT_HEALTH:-false}"
      JSON_LIMIT: "${JSON_LIMIT:-25mb}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      DEFAULT_SEARCH_LIMIT: "${DEFAULT_SEARCH_LIMIT:-25}"
      MAX_SEARCH_LIMIT: "${MAX_SEARCH_LIMIT:-200}"
      MAX_LIST_ENTRIES: "${MAX_LIST_ENTRIES:-1000}"
      MAX_READ_BYTES: "${MAX_READ_BYTES:-10mb}"
      MAX_TRANSFER_BYTES: "${MAX_TRANSFER_BYTES:-100mb}"
      MAX_INLINE_TRANSFER_BYTES: "${MAX_INLINE_TRANSFER_BYTES:-5mb}"
      TRANSFER_CHUNK_BYTES: "${TRANSFER_CHUNK_BYTES:-1mb}"
      TRANSFER_TTL_MS: "${TRANSFER_TTL_MS:-86400000}"
      MAX_ARCHIVE_ENTRIES: "${MAX_ARCHIVE_ENTRIES:-1000}"
      MAX_ARCHIVE_BYTES: "${MAX_ARCHIVE_BYTES:-100mb}"
      MAX_ARCHIVE_UNCOMPRESSED_BYTES: "${MAX_ARCHIVE_UNCOMPRESSED_BYTES:-250mb}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-1800000}"
      MCP_SESSION_RECOVERY: "${MCP_SESSION_RECOVERY:-stateless}"
      MCP_SESSION_RECOVERY_MAX_INFLIGHT: "${MCP_SESSION_RECOVERY_MAX_INFLIGHT:-64}"
      MCP_DEFAULT_AUTHOR_AGENT: "${MCP_DEFAULT_AUTHOR_AGENT:-}"
      MCP_DEFAULT_AUTHOR_MODEL: "${MCP_DEFAULT_AUTHOR_MODEL:-}"
      MCP_DISCOVERY_PROFILE: "${MCP_DISCOVERY_PROFILE:-full}"
      MCP_DISCOVERY_TOOLSETS: "${MCP_DISCOVERY_TOOLSETS:-}"
      MCP_DISCOVERY_TOOLS: "${MCP_DISCOVERY_TOOLS:-}"
      MCP_DISCOVERY_DENY_TOOLS: "${MCP_DISCOVERY_DENY_TOOLS:-}"
      OBSIDIAN_TIMEZONE: "${OBSIDIAN_TIMEZONE:-Asia/Shanghai}"
      VERSION_HISTORY_ENABLED: "${VERSION_HISTORY_ENABLED:-true}"
      MAX_VERSIONS_PER_FILE: "${MAX_VERSIONS_PER_FILE:-50}"
      GIT_ENABLED: "${GIT_ENABLED:-true}"
      GIT_AUTO_COMMIT: "${GIT_AUTO_COMMIT:-true}"
      GIT_COMMIT_DEBOUNCE_SECONDS: "${GIT_COMMIT_DEBOUNCE_SECONDS:-180}"
      GIT_COMMIT_MAX_DELAY_SECONDS: "${GIT_COMMIT_MAX_DELAY_SECONDS:-900}"
      GIT_AUTO_COMMIT_SWEEP: "${GIT_AUTO_COMMIT_SWEEP:-true}"
      GIT_SWEEP_INTERVAL_SECONDS: "${GIT_SWEEP_INTERVAL_SECONDS:-900}"
      GIT_AUTO_PUSH: "${GIT_AUTO_PUSH:-false}"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-Obsidian MCP}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-obsidian-mcp@local}"
      GIT_REMOTE: "${GIT_REMOTE:-origin}"
      GIT_BRANCH: "${GIT_BRANCH:-}"
      RETRIEVAL_INDEX_PATH: /data/index/retrieval-index.json
      RETRIEVAL_CHUNK_SIZE: "${RETRIEVAL_CHUNK_SIZE:-1400}"
      RETRIEVAL_CHUNK_OVERLAP: "${RETRIEVAL_CHUNK_OVERLAP:-180}"
      RETRIEVAL_AUTO_EMBED: "${RETRIEVAL_AUTO_EMBED:-true}"
      RETRIEVAL_REFRESH_DEBOUNCE_MS: "${RETRIEVAL_REFRESH_DEBOUNCE_MS:-1000}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-disabled}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-qwen3-embedding-0.6b-q8}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_TIMEOUT_MS: "${EMBEDDING_TIMEOUT_MS:-30000}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      EMBEDDING_INDEX_CONCURRENCY: "${EMBEDDING_INDEX_CONCURRENCY:-4}"
      EMBEDDING_EDGE_PROVIDER: "${EMBEDDING_EDGE_PROVIDER:-openai}"
      EMBEDDING_EDGE_BASE_URL: "${EMBEDDING_EDGE_BASE_URL:-}"
      EMBEDDING_EDGE_MODEL: "${EMBEDDING_EDGE_MODEL:-qwen3-embedding-0.6b-q8}"
      EMBEDDING_EDGE_API_KEY: "${EMBEDDING_EDGE_API_KEY:-}"
      EMBEDDING_EDGE_TIMEOUT_MS: "${EMBEDDING_EDGE_TIMEOUT_MS:-1500}"
      EMBEDDING_EDGE_HEALTH_INTERVAL_MS: "${EMBEDDING_EDGE_HEALTH_INTERVAL_MS:-10000}"
      EMBEDDING_EDGE_REGISTRY_URL: "${EMBEDDING_EDGE_REGISTRY_URL:-http://127.0.0.1:11435}"
      EMBEDDING_EDGE_REGISTRY_API_KEY: "${EMBEDDING_EDGE_REGISTRY_API_KEY:-}"
      MEMORY_PATH: "${MEMORY_PATH:-_Workspace/20-Memory}"
      SKILLS_PATH: "${SKILLS_PATH:-_Workspace/60-Skills}"
    volumes:
      - "${OBSIDIAN_VAULT_PATH:-./vaults/vault}:/vault"
      - "${OBSIDIAN_VAULTS_ROOT:-./vaults}:/vaults"
      - "./data:/data"
      - "./data/ssh:/root/.ssh:ro"
      - "./app/server.js:/app/server.js:ro"
      - "./app/src:/app/src:ro"
    restart: unless-stopped

  deprecation-monitor:
    image: "${DEPRECATION_MONITOR_IMAGE:-alpine:latest}"
    container_name: obsidian-deprecation-monitor
    user: "1002:10"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - "./data:/data:ro"
    environment:
      MONITOR_TAG: web-deprecation-monitor
      MONITOR_INTERVAL_SECONDS: "${MONITOR_INTERVAL_SECONDS:-3600}"
    logging:
      driver: journald
      options:
        tag: web-deprecation-monitor
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          day=$$(date -u +%Y-%m-%d)
          reason=""
          wget -q -O- --timeout=5 http://obsidian-server:18923/healthz >/dev/null 2>&1 || reason=app-unreachable
          if [ -r /data/route-metrics.json ]; then
            grep -q '"version":2' /data/route-metrics.json || reason=$${reason:-metrics-invalid}
            grep -q '"observation"' /data/route-metrics.json || reason=$${reason:-metrics-invalid}
          else
            reason=$${reason:-metrics-missing}
          fi
          [ -w /data/ops-log ] || reason=$${reason:-ops-sink-unwritable}
          markers=$$(grep -c WEB_DEPRECATION_EVIDENCE_BROKEN /data/ops-log/web-deprecation.log 2>/dev/null || echo 0)
          if [ -z "$$reason" ]; then status=healthy; else status=broken; fi
          echo "WEB_DEPRECATION_MONITOR day=$$day status=$$status reason=$${reason:-none} ops_writable=$$([ -w /data/ops-log ] && echo 1 || echo 0) markers=$$markers"
          sleep "$${MONITOR_INTERVAL_SECONDS:-3600}"
        done
