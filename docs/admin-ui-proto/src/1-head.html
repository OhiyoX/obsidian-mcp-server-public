<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>Obsidian MCP · 授权管理</title>
<style>
/* ============================================================
   Obsidian MCP Admin — prototype
   Layout system: 4px grid · spacing 4/8/12/16/24/32
   Type: 13 / 14 / 16 / 20 · weights 400 / 600
   Headers: 52px (sidebar brand / page bar / drawer head)
   Tokens mirror ui-proto (Message Server) 1:1
   ============================================================ */
:root{
  --font: Inter, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --hh:52px; --item:32px; --r:6px; --r2:8px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#101318; --side:#101318; --pane:#14171d; --elev:#1b1f27; --field:#191c23;
  --line:#23272f; --line2:#2e333d;
  --hover:rgba(255,255,255,.035); --sel:rgba(255,255,255,.065);
  --tx:#e6e8eb; --tx2:#a0a6b0; --tx3:#6c727c; --tx4:#454a53;
  --accent:#3a84ee; --accent-tx:#82c4ff; --accent-bg:rgba(58,132,238,.14);
  --ok:#4cc38a; --ok-bg:rgba(76,195,138,.12);
  --amber:#ffb454; --amber-bg:rgba(255,180,84,.12);
  --danger:#f07070; --danger-bg:rgba(240,112,112,.10); --danger-fill:#e5484d;
  --shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 1px var(--line2); --scrim:rgba(0,0,0,.55);
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f7f7f8; --side:#f7f7f8; --pane:#ffffff; --elev:#ffffff; --field:#f4f4f5;
  --line:#ececee; --line2:#dfdfe3;
  --hover:rgba(0,0,0,.03); --sel:rgba(0,0,0,.055);
  --tx:#17181b; --tx2:#5c6068; --tx3:#8a8f97; --tx4:#c2c5ca;
  --accent:#2f74e0; --accent-tx:#2f74e0; --accent-bg:rgba(47,116,224,.10);
  --ok:#1f9d63; --ok-bg:rgba(31,157,99,.10);
  --amber:#d9860b; --amber-bg:rgba(240,154,28,.12);
  --danger:#d64545; --danger-bg:rgba(214,69,69,.07); --danger-fill:#d64545;
  --shadow:0 16px 48px rgba(0,0,0,.14),0 0 0 1px var(--line2); --scrim:rgba(20,20,25,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--accent-tx);text-decoration:none}
a:hover{text-decoration:underline}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.xs{width:12px;height:12px}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.muted{color:var(--tx3)} .tx2{color:var(--tx2)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.grow{flex:1}
.nowrap{white-space:nowrap}
.ell{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:400 13px/16px var(--mono);color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;min-width:20px;text-align:center;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tx3);flex:none}
.dot.ok{background:var(--ok)} .dot.amber{background:var(--amber)} .dot.danger{background:var(--danger)} .dot.acc{background:var(--accent)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.main{background:var(--pane);display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{height:var(--hh);flex:none;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s6);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:16px;line-height:24px;font-weight:600;display:flex;align-items:baseline;gap:var(--s2);min-width:0;white-space:nowrap}
.bar h1 .crumbp{color:var(--tx3);font-weight:400}
.bar h1 .crumbp:hover{color:var(--tx);text-decoration:none}
.bar .cnt{font-size:13px;color:var(--tx3);font-weight:400}
.ibtn{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;color:var(--tx3);flex:none;transition:background .12s,color .12s}
.ibtn:hover{background:var(--hover);color:var(--tx)}
.brand{gap:var(--s2);padding:0 var(--s4);border-bottom:1px solid var(--line)}
.brand .logo{width:20px;height:20px;flex:none}
.brand b{font-size:14px;font-weight:600}
.brand span{font-size:13px;color:var(--tx3)}
.side-body{flex:1;min-height:0;padding:var(--s2)}
.ni{display:flex;align-items:center;gap:var(--s2);width:100%;height:var(--item);padding:0 var(--s2);border-radius:var(--r);color:var(--tx2);font-size:13px;transition:background .12s,color .12s}
.ni:hover{background:var(--hover);color:var(--tx);text-decoration:none}
.ni.on{background:var(--sel);color:var(--tx)}
.ni .i{color:var(--tx3)} .ni.on .i{color:var(--tx)}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .cnt{font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums}
.ni kbd{border:0;padding:0;min-width:0;color:var(--tx4)}
.sec-h{display:flex;align-items:center;height:var(--item);padding:0 var(--s2);margin-top:var(--s3);font-size:13px;color:var(--tx3)}
.side-foot{height:var(--hh);border-top:1px solid var(--line);padding:0 var(--s2);display:flex;align-items:center;gap:var(--s1)}
.ver{font:400 13px/16px var(--mono);color:var(--tx3);padding:0 var(--s2)}
.content{flex:1;min-height:0}
.page{max-width:1120px;margin:0 auto;padding:var(--s6)}
.page.wide{max-width:1280px}
.lede{color:var(--tx2);font-size:13px;margin:0 0 var(--s4)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 var(--s3);border-radius:var(--r);border:1px solid var(--line2);background:var(--elev);color:var(--tx);font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--tx4);text-decoration:none}
.btn.sm{height:28px;padding:0 var(--s2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--tx2)}
.btn.ghost:hover{background:var(--hover);color:var(--tx)}
.btn.danger-o{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:none}
.btn.danger-o:hover{background:var(--danger-bg)}
.btn.danger{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn .i{width:14px;height:14px}

/* ---------- chips / badges ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);white-space:nowrap}
.st.ok{color:var(--tx)} .st.ok .dot{background:var(--ok)}
.st.amber .dot{background:var(--amber)} .st.danger{color:var(--danger)} .st.danger .dot{background:var(--danger)}
.st.off .dot{background:var(--tx4)}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--sel);color:var(--tx2);font-size:13px;line-height:20px;white-space:nowrap}
.tag.acc{background:var(--accent-bg);color:var(--accent-tx)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.danger{background:var(--danger-bg);color:var(--danger)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.kind{font-size:13px;color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:0 5px;line-height:18px;white-space:nowrap}
.idc{display:inline-flex;align-items:center;gap:4px;font:400 13px/18px var(--mono);color:var(--tx3);border-radius:4px;padding:0 2px;margin-left:-2px;max-width:100%}
.idc:hover{color:var(--tx);background:var(--hover)}
.idc .i{width:12px;height:12px;opacity:0;transition:opacity .12s}
.idc:hover .i,.idc:focus-visible .i{opacity:1}

/* ---------- toolbar / inputs ---------- */
.toolbar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s2);border:1px solid var(--line2);border-radius:var(--r);background:var(--field);color:var(--tx3);min-width:240px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:13px;color:var(--tx)}
.search:focus-within{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);padding:2px;gap:2px;background:var(--field)}
.seg button{height:26px;padding:0 10px;border-radius:4px;font-size:13px;color:var(--tx2);white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--elev);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}
.seg button .n{color:var(--tx3);margin-left:4px;font-variant-numeric:tabular-nums}
.inp,.sel{height:32px;border:1px solid var(--line2);border-radius:var(--r);background:var(--field);padding:0 var(--s2);font-size:14px;outline:0;color:var(--tx);min-width:0;width:100%}
.inp:focus,.sel:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--tx4);font-style:italic}
.sel{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px;background-repeat:no-repeat}
.sel.sm,.inp.sm{height:28px;font-size:13px;width:auto}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.fld > .l{font-size:13px;color:var(--tx2);display:flex;gap:6px;align-items:baseline}
.fld small,.sub{font:400 13px/16px var(--mono);color:var(--tx4)}
.help{font-size:13px;color:var(--tx3);line-height:18px}
.help.warn{color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3) var(--s4)}
.pw{position:relative} .pw .inp{padding-right:36px} .pw .ibtn{position:absolute;right:2px;top:2px}

.chk{display:flex;align-items:flex-start;gap:var(--s2);padding:6px var(--s2);border-radius:var(--r);cursor:pointer;font-size:14px}
.chk:hover{background:var(--hover)}
.chk input{margin:2px 0 0;accent-color:var(--accent);width:16px;height:16px;flex:none}
.chk .d{display:block;font-size:13px;color:var(--tx3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;min-width:44px;padding:0 var(--s3);border-radius:var(--r);border:1px solid var(--line2);background:var(--field);color:var(--tx2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip:hover{color:var(--tx);border-color:var(--tx4)}
.chip.on{background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent-tx);font-weight:600}
.switch{position:relative;width:32px;height:18px;border-radius:9px;background:var(--line2);flex:none;transition:background .15s;cursor:pointer;border:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s var(--ease)}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(14px)}
.switch:disabled{opacity:.45;cursor:not-allowed}

/* ---------- cards / sections ---------- */
.card{border:1px solid var(--line);border-radius:var(--r2);background:var(--pane)}
.sect{margin-top:var(--s8)}
.sect:first-child{margin-top:0}
.sect-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);min-height:28px}
.sect-h h2{margin:0;font-size:14px;font-weight:600}
.sect-h .muted{font-size:13px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r2)}
.kv > div{padding:10px var(--s3);border-top:1px solid var(--line);min-width:0;font-size:14px}
.kv > div:nth-child(-n+2){border-top:0}
.kv > .k{color:var(--tx3);font-size:13px}
.banner{display:flex;gap:var(--s2);align-items:flex-start;padding:10px var(--s3);border-radius:var(--r2);font-size:13px;line-height:18px;border:1px solid var(--line);background:var(--field);color:var(--tx2);margin-bottom:var(--s4)}
.banner .i{margin-top:1px}
.banner.amber{border-color:color-mix(in srgb,var(--amber) 35%,transparent);background:var(--amber-bg);color:var(--tx)}
.banner.amber .i{color:var(--amber)}
.banner.danger{border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-bg);color:var(--tx)}
.banner.danger .i{color:var(--danger)}
.banner.acc .i{color:var(--accent-tx)}
.banner b{font-weight:600}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:14px}
.tw{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl th{height:36px;text-align:left;font-weight:400;font-size:13px;color:var(--tx3);padding:0 var(--s3);border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td{padding:10px var(--s3);border-bottom:1px solid var(--line);vertical-align:middle;min-width:0;overflow:hidden}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.cur{background:var(--sel)}
.tbl tbody tr.fail{background:var(--danger-bg)}
.tbl tbody tr.fail:hover{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.tbl tbody tr.dim td > *:not(.act){opacity:.55}
.tbl td.act{width:48px;text-align:right;padding-right:var(--s2)}
.tbl th.act{width:48px}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .sub2{font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.cellt{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cellt .muted{font-size:13px}
.grp td{background:var(--bg);font-size:13px;color:var(--tx3);padding:6px var(--s3)}
.pager{display:flex;align-items:center;gap:var(--s2);justify-content:space-between;margin-top:var(--s3);font-size:13px;color:var(--tx3)}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager .pg button{min-width:28px;height:28px;border-radius:var(--r);color:var(--tx2);text-align:center;font-variant-numeric:tabular-nums}
.pager .pg button:hover{background:var(--hover)}
.pager .pg button.on{background:var(--sel);color:var(--tx)}
.uax{font:400 13px/18px var(--mono);color:var(--tx3);padding:8px var(--s3) 12px;word-break:break-all;background:var(--bg)}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.stat{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r2);background:var(--pane);color:var(--tx);transition:border-color .12s,background .12s;min-width:0}
.stat:hover{border-color:var(--line2);background:var(--hover);text-decoration:none}
.stat .t{display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--tx2)}
.stat .t .i{color:var(--tx3)}
.stat .n{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d .w{color:var(--amber)}
.ov2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s4);margin-top:var(--s6)}
.list{border:1px solid var(--line);border-radius:var(--r2)}
.li{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:var(--s2) var(--s3);border-top:1px solid var(--line);font-size:13px;color:var(--tx2);min-width:0}
.li:first-child{border-top:0}
.li b{color:var(--tx);font-weight:400;font-size:14px}
a.li:hover{background:var(--hover);text-decoration:none}
.li .r{margin-left:auto;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;background:var(--pane);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s var(--ease);z-index:41;display:flex;flex-direction:column}
.drawer:not(.on){box-shadow:none;visibility:hidden;transition:transform .2s var(--ease),visibility 0s .2s}
.drawer.on{transform:none}
.drawer .bar{padding:0 var(--s4) 0 var(--s6)}
.dbody{flex:1;min-height:0;padding:var(--s6)}
.dfoot{flex:none;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s6);border-top:1px solid var(--line)}
.dfoot .help{flex:1}
.dsec{margin-top:var(--s6)} .dsec:first-child{margin-top:0}
.dsec > h3{margin:0 0 var(--s2);font-size:13px;font-weight:600;color:var(--tx2)}
.danger-zone{border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:var(--r2)}
.dz{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-top:1px solid color-mix(in srgb,var(--danger) 18%,transparent)}
.dz:first-child{border-top:0}
.dz .t{flex:1;min-width:0;font-size:13px;color:var(--tx3)} .dz .t b{display:block;color:var(--tx);font-size:14px;font-weight:600}
.modal{position:fixed;left:50%;top:22vh;transform:translate(-50%,8px);width:440px;max-width:calc(100vw - 32px);background:var(--elev);border-radius:12px;box-shadow:var(--shadow);padding:var(--s6);z-index:51;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s var(--ease)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.modal h3{margin:0 0 var(--s2);font-size:16px;line-height:24px;font-weight:600}
.modal p{margin:0 0 var(--s3);color:var(--tx2);font-size:14px;line-height:22px}
.modal p b{color:var(--tx);font-weight:600}
.modal ul{margin:0 0 var(--s3);padding-left:18px;color:var(--tx2);font-size:13px;line-height:20px}
.modal .acts{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s4)}
.modal .tc{font-size:13px;color:var(--tx3);margin-bottom:6px} .modal .tc code{font-family:var(--mono);color:var(--tx);background:var(--sel);padding:0 4px;border-radius:4px}
#mscrim{z-index:50}
.menu{position:fixed;min-width:180px;background:var(--elev);border-radius:var(--r2);box-shadow:var(--shadow);padding:var(--s1);z-index:45;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:var(--s2);width:100%;height:32px;padding:0 var(--s2);border-radius:4px;font-size:13px;color:var(--tx)}
.menu button:hover,.menu button.kb{background:var(--hover)}
.menu button .i{color:var(--tx3)}
.menu button.dz2{color:var(--danger)} .menu button.dz2 .i{color:var(--danger)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--elev);color:var(--tx);box-shadow:var(--shadow);border-radius:var(--r2);padding:10px var(--s4);font-size:13px;display:flex;gap:var(--s3);align-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s var(--ease);z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .i{color:var(--ok)} .toast.err .i{color:var(--danger)}
.toast button{color:var(--accent-tx);font-size:13px}
.kbdp{width:560px}
.kbdp .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px var(--s6)}
.kbdp .row{display:flex;justify-content:space-between;align-items:center;height:28px;font-size:13px;color:var(--tx2)}
.kbdp h4{grid-column:1/-1;margin:var(--s3) 0 0;font-size:13px;color:var(--tx3);font-weight:400}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px var(--s6);gap:var(--s2);color:var(--tx3);font-size:13px}
.empty .ic{width:40px;height:40px;border-radius:10px;background:var(--sel);display:grid;place-items:center;color:var(--tx2);margin-bottom:var(--s2)}
.empty b{color:var(--tx);font-size:14px;font-weight:600}
.secret{display:flex;align-items:center;gap:var(--s2);padding:var(--s3);border:1px dashed color-mix(in srgb,var(--amber) 50%,transparent);border-radius:var(--r2);background:var(--amber-bg);font:400 13px/18px var(--mono);word-break:break-all}

/* ---------- policy editor ---------- */
.ped{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:100%}
.ped-form{padding:var(--s6) var(--s8) 96px;max-width:760px}
.ped-side{border-left:1px solid var(--line);background:var(--bg);padding:var(--s6)}
.ped-side .stick{position:sticky;top:0}
.fs{border:0;padding:0;margin:0 0 var(--s8)}
.fs > legend{padding:0;margin-bottom:var(--s3);font-size:14px;font-weight:600;display:flex;gap:var(--s2);align-items:baseline;width:100%}
.fs > legend .muted{font-weight:400;font-size:13px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.mode button{border:1px solid var(--line2);border-radius:var(--r2);padding:var(--s3);background:var(--field);display:flex;flex-direction:column;gap:2px}
.mode button b{font-weight:600;font-size:14px;display:flex;gap:var(--s2);align-items:center}
.mode button span{font-size:13px;color:var(--tx3);line-height:18px}
.mode button.on{border-color:var(--accent);background:var(--accent-bg)}
.mode button.on.rv{border-color:var(--danger);background:var(--danger-bg)}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--tx4);flex:none;display:inline-block}
.on > b > .radio{border:4px solid var(--accent)} .on.rv > b > .radio{border-color:var(--danger)}
.wrow{display:grid;grid-template-columns:auto 120px 16px 120px 28px;gap:var(--s2);align-items:center;margin-top:var(--s2)}
.wrow .lab{font-size:13px;color:var(--tx3);min-width:84px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 28px;gap:var(--s2);align-items:center;margin-top:var(--s2)}
.addl{display:inline-flex;align-items:center;gap:6px;color:var(--accent-tx);font-size:13px;height:28px;margin-top:var(--s2)}
.picker{border:1px solid var(--line2);border-radius:var(--r2);background:var(--pane);overflow:hidden}
.picker .search{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;min-width:0}
.pick-list{max-height:280px}
.pick-g{font-size:13px;color:var(--tx3);padding:8px var(--s3) 4px;display:flex;justify-content:space-between}
.pick{display:flex;align-items:center;gap:var(--s3);padding:6px var(--s3);cursor:pointer;min-height:44px}
.pick:hover{background:var(--hover)}
.pick input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.pick .nm{flex:1}
.selrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 var(--s2);border-radius:var(--r);background:var(--sel);font-size:13px;max-width:100%}
.pill .kind{border:0;padding:0;color:var(--tx3)}
.pill button{width:20px;height:20px;display:grid;place-items:center;color:var(--tx3);border-radius:4px}
.pill button:hover{background:var(--hover);color:var(--tx)}
.cap-g{border-top:1px solid var(--line)}
.cap-g:first-child{border-top:0}
.cap-h{display:flex;align-items:center;gap:var(--s2);width:100%;height:40px;padding:0 var(--s3);font-size:13px;color:var(--tx2)}
.cap-h:hover{background:var(--hover)}
.cap-h b{color:var(--tx);font-weight:600;font-size:14px}
.cap-h .chev{transition:transform .15s var(--ease);color:var(--tx3)}
.cap-h.open .chev{transform:rotate(90deg)}
.cap-b{padding:0 var(--s2) var(--s2) 28px;display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s2)}
.cap-b .chk .mono{color:var(--tx4);font-size:13px}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:13px;color:var(--tx3)}
.tl .tr{position:relative;height:16px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/24)),var(--field)}
.tl .tr .w{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent);opacity:.85}
.tl .tr .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber);border-radius:1px}
.tl .ax{display:flex;justify-content:space-between;font:400 13px/16px var(--mono);color:var(--tx4)}
.tl .today{color:var(--tx)}
.sumbox{padding:var(--s3);border-radius:var(--r2);border:1px solid var(--line);background:var(--pane);font-size:13px;line-height:20px;color:var(--tx2)}
.sumbox b{color:var(--tx);font-weight:600}
.verdict{display:flex;align-items:center;gap:var(--s2);padding:var(--s3);border-radius:var(--r2);font-size:13px;margin-top:var(--s2)}
.verdict.ok{background:var(--ok-bg)} .verdict.ok .i{color:var(--ok)}
.verdict.no{background:var(--danger-bg)} .verdict.no .i{color:var(--danger)}
.ped-foot{position:sticky;bottom:0;display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s8);border-top:1px solid var(--line);background:var(--pane);z-index:3}
.vcard{border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);background:var(--pane)}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.vh{display:flex;align-items:center;gap:var(--s2)}
.vh b{font-size:16px;font-weight:600}
.caps{display:flex;flex-wrap:wrap;gap:4px}
.cap{font-size:13px;color:var(--tx2);display:inline-flex;gap:6px;align-items:center;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line)}
.cap.off{color:var(--tx3);border-style:dashed}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:var(--s6);background:var(--bg)}
.login .box{width:360px;max-width:100%;display:flex;flex-direction:column;gap:var(--s4)}
.login h1{margin:0;font-size:20px;line-height:28px;font-weight:600;display:flex;align-items:center;gap:var(--s2)}
.login .btn.primary{width:100%;height:40px;font-size:14px}
.login .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--tx3)}

/* ---------- mobile ---------- */
.mnav{display:none}
.mcards{display:none}
@media (max-width:1100px){
  .ped{grid-template-columns:minmax(0,1fr)} .ped-side{border-left:0;border-top:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  .bar{padding:0 var(--s4)}
  .page{padding:var(--s4)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
  .stat{padding:var(--s3)}
  .ov2{grid-template-columns:minmax(0,1fr)}
  .li > span.ell{display:none}
  .banner:has(.bm){flex-wrap:wrap} .banner > div{min-width:0;flex:1 1 0} .banner .bm{width:100%;padding-left:24px}
  .tw.hide-m{display:none}
  .mcards{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r2)}
  .mc{display:flex;gap:var(--s3);padding:var(--s3);border-top:1px solid var(--line);align-items:flex-start;min-width:0}
  .mc:first-child{border-top:0}
  .mc .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .mc .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--tx3)}
  .mc.fail{background:var(--danger-bg)}
  .search{min-width:0;flex:1}
  .toolbar .hide-m{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .drawer{width:100vw;top:auto;height:92dvh;border-radius:12px 12px 0 0;transform:translateY(102%)}
  .drawer.on{transform:none}
  .dbody{padding:var(--s4)} .dfoot{padding:var(--s3) var(--s4)}
  .ped-form{padding:var(--s4) var(--s4) 96px}
  .ped-side{padding:var(--s4)}
  .ped-foot{padding:var(--s3) var(--s4);bottom:0}
  .wrow{grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 28px}
  .wrow .lab{grid-column:1/-1;margin-top:var(--s1)}
  .cap-b{grid-template-columns:1fr}
  .mode{grid-template-columns:1fr}
  .vgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:96px minmax(0,1fr)}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--pane);border-top:1px solid var(--line);z-index:30}
  .mnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--tx3)}
  .mnav a:hover{text-decoration:none}
  .mnav a.on{color:var(--tx)}
  .mnav .i{width:20px;height:20px}
  .hide-m,.bar .hide-m{display:none!important}
  .modal{top:auto;bottom:16px}
  .kbdp .cols{grid-template-columns:1fr}
}
/* ---------- planned (future) markers: hidden with ?dev=1&future=0 ---------- */
.fut{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9px;font-size:13px;line-height:18px;color:#a78bfa;background:rgba(167,139,250,.12);border:1px dashed rgba(167,139,250,.45);white-space:nowrap;font-weight:400;vertical-align:middle}
[data-theme=light] .fut{color:#7c3aed;background:rgba(124,58,237,.07)}
.futbox{border:1px dashed rgba(167,139,250,.45);border-radius:var(--r2);padding:var(--s3)}
body.nofut .fut,body.nofut .futonly{display:none!important}
.lock-note{font-size:13px;color:var(--danger)}
