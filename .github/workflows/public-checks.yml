name: Public checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix app
      - name: Check JavaScript and architecture
        run: npm run check --prefix app
